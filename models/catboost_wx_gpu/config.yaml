family: v8_boost_wx
variant: catboost
buckets: [0, 1, 2, 3, 4]        # customer_bucket values: each ~1 % of customers -> 5 %. null = every customer
train_sample: 0.2               # share of the trainable windows kept (stable hash): with >= 30 target days 5 % of
                                # customers give ~1.3M windows (~15 s per CatBoost tree on 64 cores); 0.2 keeps ~260k
max_window_gb: 40               # refuse if kin + ktg would need more (raise on a big pod)
workers: null                   # districts read in parallel (null: evaluate.py --workers)
wp:                             # other whole_pipeline_v8 settings (part of the shared fit), e.g. CATBOOST_PARAMS
  SEGMENT_USE_OLD: true         # segments + priors from all history: every 2024 refit has old-regime data only (v8: false)
  TRAIN_MIN_TARGET_DAYS: 30     # train on windows with >= 30 of 60 target days observed (v8: 54, which keeps ~1 % of the
                                # pre-2024-08 windows: regime_audit.py); a missing target day = residual 0 (no correction)
  OLD_REGIME_FLAG: true         # feature regime_old = issue date before 2024-08-01: old winters read 10-17 % higher for the
                                # same customers (regime_audit.py E); 1 for 2024 issue dates, 0 from 2024-08
  MAX_FINAL_ITERATIONS: 1500    # v8: 150, which cut the 2025-01 refit from 2,996 best trees to 150 (log_s25_catboost)
  CATBOOST_PARAMS:              # merged into v8's dict: only the keys listed change
    learning_rate: 0.15         # v8: 0.05 never early-stopped within 3,000 trees on ~400k windows (6.5 s a tree)
  XGB_PARAMS:
    learning_rate: 0.15
wx:                             # the real forecasts (core/reforecast.py; ML guide part 2). Same block in catboost_wx and
                                # xgboost_wx: they share one fit per refit
  source: aifs                  # aifs | fcn3 | ens (mean of the two); run evaluate.py with --weather <source>
  sets: [wx-val2024-20261021t120926z, wx-test2025-20261021t120926z]   # never the 2026 reserve
  root: s3://data-weather/reforecast/
  lead_days: 14                 # h1..h14 from the forecast issued on o; later days: normal + fading anomaly
  origins: reforecast+stride    # reforecast: only windows on issue dates (all with a forecast); +stride: also v8's
                                # staggered windows (no forecast, normals) so 2022-2023 stay in training
  cache_dir: ~/work/eval/reforecast   # daily archive per set and model (built once, then read locally)
  point_map: null               # csv point,coato_code if the forecast points are not the district codes
  min_windows: 20000            # refuse a refit with fewer windows that have a forecast
gpu: [catboost, xgboost]        # train both boosters on GPU 0 (scripts/gpu_check.py first); prediction stays on CPU
