# THE FIXED TEST SET. Every model is scored on exactly this definition by scripts/test_set/score_test.py.
# Do not edit a released version: copy it to a new `version` and rebuild (the builder records this file's hash in the
# manifest, and the scorer refuses forecasts built from a different hash).
#
# Design (agreed 2026-10-22):
#   - 180 test days = four seasonal blocks of 45 days; each block is one walk-forward fold with its own fit
#     (training data ends before the block's first origin; roughly quarterly retraining, as the ТЗ requires).
#   - Forecasts issued every day; every test day is scored at every horizon 1..60.
#   - All eligible households. Fixed panel per fold = households eligible at the fold's first origin.
#   - Node actual on day d = N x (mean kWh of the panel households observed on d)    (coverage-adjusted total)
#     scored when N >= min_households and observed share >= min_coverage.
#   - Bottom-up models also get the matched score: sum of forecasts vs sum of actuals over the same observed households.

version: ts-2026-10-22-v1

data:
  uri: s3://phase1/electricity/_staging/household-enriched-v14-nat-b2c-20261017-8e1414/
  env_prefix: ""
  start: "2022-01-01"            # first day any model may read (history)
  end: "2026-06-29"              # last customer-day of v1.4
  labels: [complete_observed]    # HH-GAP-001-A1: only observed days are actuals and inputs

# Eligibility at a fold's first origin (same rule as the harness / whole_pipeline_v8):
# >= min_input_days observed of the last lookback_days, and >= min_recent_days of the last recent_days.
panel:
  lookback_days: 90
  min_input_days: 60
  recent_days: 30
  min_recent_days: 20

folds:
  - name: summer
    test_start: "2025-07-01"
    test_end: "2025-08-14"
    cutoff: "2025-03-03"         # last training origin; training targets end <= cutoff + 60 = first origin
    train_val: ["2024-09-01", "2025-03-03"]
    first_origin: "2025-05-02"   # test_start - 60: its h=60 forecast is test_start
    last_origin: "2025-08-13"    # test_end - 1: its h=1 forecast is test_end
  - name: autumn
    test_start: "2025-10-01"
    test_end: "2025-11-14"
    cutoff: "2025-06-03"
    train_val: ["2024-12-02", "2025-06-03"]
    first_origin: "2025-08-02"
    last_origin: "2025-11-13"
  - name: winter
    test_start: "2025-12-20"
    test_end: "2026-02-02"
    cutoff: "2025-08-22"
    train_val: ["2025-02-20", "2025-08-22"]
    first_origin: "2025-10-21"
    last_origin: "2026-02-01"
  - name: spring
    test_start: "2026-03-01"
    test_end: "2026-04-14"
    cutoff: "2025-11-01"
    train_val: ["2025-05-02", "2025-11-01"]
    first_origin: "2025-12-31"
    last_origin: "2026-04-13"

origin_step_days: 1
horizons: 60

# Levels and the horizons stored per level (finer levels only at the control horizons: file size)
levels:
  national:    {horizons: all}
  region:      {horizons: all}
  district:    {horizons: all}
  substation:  {horizons: [1, 7, 14, 30, 60]}
  feeder:      {horizons: [1, 7, 14, 30, 60]}
  transformer: {horizons: [1, 7, 14, 30, 60], optional: true}

scoring:
  min_households: 10             # node size N (panel households); smaller nodes are never written or scored
  min_coverage: 0.8              # observed share of the panel on the target day
  control_horizons: [1, 7, 14, 30, 60]
  primary_level: national        # the ТЗ's system-level sysMAPE
  # ТЗ 4.2.4: sysMAPE = sum_d |P_d - A_d| / sum_d A_d over all test days; rejection if any is exceeded
  spec_thresholds: {1: 0.08, 7: 0.11, 14: 0.15, 30: 0.18, 60: 0.20}
  bias_audit_ratio: 1.5          # ТЗ bias audit: a group's sysMAPE may be at most 1.5 x the overall value

# Public holidays in the test blocks (bias audit day types). CHECK against the official decrees for 2025-2026;
# the Islamic holidays move with the moon and extra days off are announced each year.
holidays:
  "2025-10-01": Teachers' Day
  "2026-01-01": New Year
  "2026-01-02": New Year (day off)
  "2026-03-08": International Women's Day
  "2026-03-20": Ramazon hayit (Eid al-Fitr), date to confirm
  "2026-03-21": Navruz
  "2026-03-22": Navruz (day off)
  "2026-03-23": Navruz (day off)

# Known limitations (repeated in every score report)
notes:
  - Network mapping is last-known and applied retrospectively (data guide); feeder / substation totals assume today's network.
  - Feeder / substation levels cover households with a complete network path only (~86%); district and above cover all.
  - Blocks 2-4 overlap the harness dev-test window already looked at during development; this is the fixed internal
    benchmark, not the customer-approved acceptance sample.
  - Tariff-group slices of the bias audit are not available (households are one tariff group in this dataset).
