# Evaluation harness settings (evaluate.py). Fixed before any holdout run; change them only between holdout periods.
data:
  start: "2022-01-01"
  labels: [complete_observed]            # HH-GAP-001-A1: only observed one-day clean kWh is an input or an actual
  history_days: 730                      # days of history each panel carries (year-ago inputs need >= 425)
  dev:                                   # developer zone: everything I may look at
    uri: s3://phase1/electricity/_staging/household-enriched-v14-nat-b2c-20261017-8e1414/
    env_prefix: ""                       # my normal key (AWS_ACCESS_KEY_ID, ...)
    end: "2026-06-29"
  vault:                                 # holdout: the next data release, read only by evaluate.py
    uri: null                            # set when the data owner has built it, e.g. s3://phase1/electricity/_vault/household-enriched-v15/
    env_prefix: VAULT_                   # its own key: VAULT_AWS_ACCESS_KEY_ID, VAULT_AWS_SECRET_ACCESS_KEY, VAULT_S3_ENDPOINT
    env_file: ~/work/vault_env.sh        # holds those three lines; never sourced in notebooks
    start: "2026-06-30"
    end: null                            # last day in the vault release

modes:                                   # validate / test: configs/test_set.yaml (the ML guide's standard split)
  holdout:                               # the one honest score per model version
    cutoff: "2026-04-30"
    train_val: ["2025-08-01", "2026-02-28"]
    origins: {first: "2026-06-30", last: null, step: 7}   # last: the vault's end minus 60 days
    period: "2026-H2"                    # budget is counted per period

scoring:
  horizons: [1, 7, 14, 30, 60]
  min_households: 10                     # nodes with fewer scored households per day are not summarised
  headline: {level: feeder, stat: pooled, horizons: [7, 30]}

budget:                                  # holdout looks
  per_commit: 1
  per_month: 2

wandb:                                   # experiment tracking (evaluate.py validate / test, compare_models.py)
  enabled: true                          # also off with --no-wandb or WANDB_MODE=disabled; key: `wandb login` / WANDB_API_KEY
  project: electricity-forecast
  entity: null                           # team / user; null = the logged-in default
  windows_per_split: 12                  # window-sample charts per split (at least 10 where the data allow)
  dir: ~/work/eval                       # local W&B files (offline runs: wandb sync)
mlflow:                                  # model registry only (evaluate.py --register, python -m harness.registry)
  enabled: true
  uri: null                              # null: MLFLOW_TRACKING_URI, else a local SQLite store ~/work/eval/mlflow.db
  experiment: electricity/eval
  registered_model: electricity_household_forecast   # production name; --register writes electricity_household_<model>
                                                      # (see harness/registry.py; promote --to-production copies here)

run:
  out_dir: ~/work/eval
  workers: 4
  block: 20000                           # households per predict call
  scaling:                               # district forecast = present x mean household forecast x c(o)
    method: ratio                        # ratio: c(o) = T2 per customer / fresh households' observed mean, last `days`
    days: 28                             #   days up to o - 1 (fresh households use ~10 % more); none: c = 1
    clip: [0.5, 2.0]
